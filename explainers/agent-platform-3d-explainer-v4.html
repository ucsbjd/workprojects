<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governed Agent Platform</title>
<!--
  ======================================================================
  HOW TO EDIT THE WORDS ON THIS PAGE (no tools needed)

  1. Open this file in Notepad. The text block right below this note
     (the script with id="content") holds every word on the page.
  2. Change any text after an "=" sign. Save. Reload the page.
       [meta]        page heading
       [group x]     dashed boundary boxes
       [node x]      boxes in the diagram (name, sub-line, detail)
       [flow x]      arrows (label and detail)
       [step x]      chapters of the walkthrough, in the order written
                     (log1..log4 = the example run lines in the side panel,
                      written as:  tag | text | colour   where colour is
                      c1 orange, c2 teal, c3 blue, c4 green, c5 violet,
                      c6 gold, ro gray or err red)
     Names such as Engineer 1, agent-1, Team A or mcp-jira are plain text
     in the [node ...] sections. Rename them there.
  3. A long value can continue on the next lines if they start with
     two spaces. A blank line between them starts a new paragraph.
     **double stars** make bold, `backticks` make code, {gw} inserts
     the name of node gw.
  4. Lines that start with # are notes and are ignored.

  Or, in the browser: press E to edit text in place, then Ctrl+S to
  save a new copy of this file. Press O (or drag a .txt onto the page)
  to load text in this same format from a file.

  Keys: M walkthrough / overview, V 3D / 2D, F full-screen diagram, [ ] smaller / larger labels,
  Space play, arrows step, R reset camera, T light/dark, P presenter size.
  ======================================================================
-->
<script type="text/plain" id="content">
[meta]
kicker = Explainer · Agent management
title = Each agent acts as one engineer and writes in one place
subtitle = Engineer, own agent, released skills, LLM, MCP servers, reference data, shared output

[group cmz]
name = CM-controlled area

[group env]
name = Windows environment · agent domain

[group mcpz]
name = MCP servers · same domain

[group cloud]
name = Off-premises cloud

[node eng]
name = Engineers
sub = Laptops · PKI sign-in
detail = Each engineer works from a Windows laptop and signs in with a PKI certificate. They prompt their own agent and review everything it writes. Three engineers are shown as an example.

[node lead]
name = Group Lead
sub = Approves and releases
detail = The only person who can release a skill or memory change into the CM-controlled area. Engineers propose changes; the Group Lead reviews and approves them.

[node mem]
name = Memory
sub = MEMORY.md · locked
detail = The shared `MEMORY.md` that every agent reads. It sits in the CM-controlled area, so it is locked and versioned like any other CM item. Agents can read it; only a release by the {lead} changes it.

[node skops]
name = Operations summary
sub = Skill · past day's events
detail = A released skill. It has the agent use {mcpc} to search {conf} for operations events from the past day, then reply to the engineer.

[node skmaint]
name = Maintenance activity
sub = Skill · creates an entry
detail = A released skill. It takes the engineer's input and has the agent interact with the {webapp} to write a maintenance event into that application's database.

[node agents]
name = Agents
sub = agent-1 · agent-2 · agent-3
detail = One agent per engineer, running in the Windows environment. Each carries its user's certificate, so everything it does is done as, and traceable to, that engineer. Agents read released skills and memory, think with the {llm}, and act only through the connections shown here.

[node tasks]
name = Scheduled tasks
sub = e.g. weekdays 06:00
detail = A scheduled task in the Windows environment can start an agent at a set time, for example every weekday morning. The run uses the owning engineer's certificate and the same released skills.

[node llm]
name = LLM
sub = Off-premises · HTTPS
detail = A large language model hosted in the cloud and reached over an encrypted HTTPS API. It returns plans and drafts. It has no access to our systems: anything it suggests is carried out by the agent.

[node mcpj]
name = mcp-jira
sub = MCP server · Jira
detail = Gives agents controlled, two-way access to {jira}: search issues, read them and post updates. Agents never hold Jira credentials themselves.

[node mcpc]
name = mcp-confluence
sub = MCP server · Confluence
detail = Gives agents controlled, two-way access to {conf}: search and read pages, post updates. Agents never hold Confluence credentials themselves.

[node mcpd]
name = mcp-docs
sub = MCP server · reference
detail = Gives agents access to the {ref}. It is read-only: any attempt to write is refused.

[node jira]
name = Jira
sub = Connected app
detail = Issue tracking. Reached only through {mcpj}.

[node conf]
name = Confluence
sub = Connected app
detail = Wiki pages. Reached only through {mcpc}.

[node webapp]
name = Maintenance web app
sub = Has its own database
detail = A web application for maintenance events. The maintenance skill takes the engineer's input and writes a maintenance event into this application's database.

[node ref]
name = Reference directories
sub = SOPs · documents · history
detail = The user-defined reference directories: SOPs, technical documents, and historical records and logs. Agents can only read from them.

[node out]
name = Shared output directory
sub = Only writable path
detail = The only path agents can write to, with a folder per user. Each engineer sets their agent's write directory and reviews what it produces. A Metrics & Tool Usage folder tracks skills used, time saved and customer value. Nothing here becomes a CM item on its own.

[flow chat]
label = Prompts · replies
detail = The engineer sends prompts; the agent answers in the same conversation, signed with the engineer's certificate.

[flow propose]
label = Propose change
detail = An engineer proposes a change to a skill or to the shared memory file.

[flow release]
label = Approve · release
detail = The Group Lead reviews the change, approves it and releases it into the CM-controlled area.

[flow load_mem]
label = Read-only
detail = Agents load the shared memory file. They cannot change it.

[flow load_ops]
detail = Agents read the operations summary skill. They cannot change it.

[flow load_maint]
detail = Agents read the maintenance activity skill. They cannot change it.

[flow sched]
label = Starts a run
detail = At the set time the scheduled task starts an agent, as the engineer who owns the task.

[flow llm_call]
label = HTTPS · encrypted
detail = The agent sends a prompt with context to the LLM and gets a plan or draft back. Traffic is encrypted.

[flow mcp_jira]
label = Issues
detail = Agent requests to Jira go through {mcpj}, in both directions.

[flow mcp_conf]
label = Pages
detail = Agent requests to Confluence go through {mcpc}, in both directions.

[flow mcp_docs]
label = Documents
detail = Agent requests for reference documents go through {mcpd}.

[flow jira_app]
label = Search · post
detail = {mcpj} searches issues and posts updates in Jira.

[flow conf_app]
label = Read · update
detail = {mcpc} reads pages and posts updates in Confluence.

[flow ref_read]
label = Read only
detail = Reference data flows one way, out of the directories. Writes are refused.

[flow write]
label = Write only here
detail = The only place an agent can write: one folder per user in the shared output directory.

[flow review]
label = Review
detail = The engineer opens and reviews what the agent wrote.

[flow maint_write]
label = Maintenance entry
detail = Following the maintenance skill, the agent writes the engineer's maintenance event into the web application's database.

[step overview]
short = Overview
title = One agent per engineer, governed end to end
body = Each **engineer** prompts their own **agent**. Agents run in our **Windows environment** under that engineer's certificate and follow the skills and memory released into the **CM-controlled area**. They reason with an off-premises **{llm}**, reach Jira, Confluence and reference data through **MCP servers**, and write only to the **{out}**.
callout_label = Read the colors
callout = Orange is people, teal is agents, blue is memory, gold is skills, green is connected systems, violet is agent output and gray is read-only.
focus = all
flows = all
log1 = status | 3 agents online · Windows environment | c2
log2 = cm | 2 skills + MEMORY.md (locked) | c6
log3 = mcp | jira · confluence · docs connected | c4

[step prompt]
short = Prompt
title = Engineers prompt their own agent
body = Each engineer works from a **Windows laptop** and signs in with a **PKI certificate**. They chat with their own agent: prompts go out and answers come back in the same conversation.

  The agent carries **its user's certificate**, so everything it does is done as, and traceable to, that engineer.
callout_label = One engineer, one agent
callout = An agent never acts under a shared or anonymous identity.
focus = eng, agents
flows = chat
log1 = auth | PKI cert CN=eng1 verified | c1
log2 = prompt | eng1: "List open defects for the release" | c1
log3 = reply | agent-1: 14 open, 3 critical. Summary below. | c2

[step approve]
short = Approve
title = Skill and memory changes go through the Group Lead
body = Agents follow released **skills** and a shared `MEMORY.md`. To improve one, an engineer **proposes** the change to the **{lead}**, who reviews it, approves it and **releases** it into the **CM-controlled area**. Nothing else can write there.
callout_label = Configuration management
callout = Released skill and memory files are locked and versioned, like any other CM item.
focus = eng, lead, mem, skops, skmaint
flows = propose, release
log1 = propose | eng2 to Group Lead: update the operations summary skill | c1
log2 = approve | Group Lead approved the change | c1
log3 = release | skill into CM area (locked) | c6

[step load]
short = Load skills
title = Every agent starts from the same released instructions
body = When an agent starts work, it reads the released **skills** and the shared `MEMORY.md` from the **CM-controlled area**. It can **read** them, but it cannot change them.
callout_label = Same files, same behavior
callout = Every agent works from the same released skills and memory.
focus = mem, skops, skmaint, agents
flows = load_mem, load_ops, load_maint
log1 = read | operations-summary ✓ read-only | c6
log2 = read | maintenance-activity ✓ read-only | c6
log3 = read | MEMORY.md ✓ read-only | c3

[step schedule]
short = Schedules
title = Scheduled tasks start agents on their own
body = Not every run needs a prompt. A **scheduled task** in the Windows environment can start an agent at a set time, for example every weekday morning. The run still uses the owning engineer's certificate and the same released skills.
callout_label = Owned automation
callout = A scheduled run belongs to a named engineer, just like a chat.
focus = tasks, agents
flows = sched
log1 = task | 06:00 weekdays, agent-3 | c2
log2 = fired | 06:00:00 run started as eng3 | c2

[step llm]
short = LLM
title = The LLM thinks; only the agent acts
body = To think through a task, an agent calls the **{llm}** in the cloud over an **encrypted HTTPS API**. The LLM sends back plans and drafts. It has no access to our systems: anything it suggests doing is carried out by the agent, inside our environment.
callout_label = Thinking vs. doing
callout = The LLM only suggests. The agent acts, and only through the connections shown here.
focus = agents, llm
flows = llm_call
log1 = https | out to LLM API (TLS): prompt + context | c2
log2 = https | back: plan + draft | c2

[step mcp]
short = MCP servers
title = MCP servers connect agents to Jira and Confluence
body = **MCP servers** run in the same domain as the agents. `{mcpj}` and `{mcpc}` give agents two-way access to **Jira** and **Confluence**: search issues, read pages, post updates.
callout_label = One door per system
callout = Agents never hold Jira or Confluence credentials. Each MCP server is the single, controlled way in.
focus = agents, mcpj, mcpc, jira, conf
flows = mcp_jira, mcp_conf, jira_app, conf_app
log1 = mcp | jira: search open defects ✓ | c4
log2 = mcp | confluence: read release page ✓ | c4

[step reference]
short = Reference data
title = Reference data is read-only
body = `{mcpd}` gives agents access to the user-defined **{ref}**: **SOPs**, **technical documents** and **historical records and logs**. Agents only **read** from them. Any attempt to write there is refused.
callout_label = Look, don't touch
callout = Agents can learn from years of documents and logs without any risk of changing them.
focus = agents, mcpd, ref
flows = mcp_docs, ref_read
log1 = mcp | docs: read SOPs/release.md ✓ | ro
log2 = mcp | docs: read history/2025 logs ✓ | ro
log3 = mcp | docs: write SOPs/... ✗ read-only | err

[step skill_ops]
short = Ops summary
title = A skill turns Confluence events into a daily summary
body = The **{skops}** skill is a released instruction the agent follows. It uses **{mcpc}** to search **Confluence** for operations events from the past day, then replies to the engineer who asked.
callout_label = Skill in action
callout = The skill searches Confluence through its MCP server, then answers the engineer.
focus = eng, agents, skops, mcpc, conf
flows = chat, load_ops, mcp_conf, conf_app
log1 = skill | operations-summary loaded | c6
log2 = mcp | confluence: search events, past day ✓ | c4
log3 = reply | agent-1: summary sent to eng1 ✓ | c2

[step skill_maint]
short = Maintenance
title = A skill writes a maintenance event for the engineer
body = The **{skmaint}** skill takes what the engineer enters and has the agent interact with the **{webapp}**, which writes a maintenance event into its own database.
callout_label = Skill in action
callout = The engineer's input becomes a maintenance event in the web application's database.
focus = eng, agents, skmaint, webapp
flows = chat, load_maint, maint_write
log1 = skill | maintenance-activity loaded | c6
log2 = input | eng1 describes the maintenance activity | c1
log3 = web | event written to the database ✓ | c4

[step outputs]
short = Outputs
title = Outputs land in one shared directory
body = The **{out}** is the **only path agents can write to**, with a folder per user. Each engineer sets their agent's write directory and **reviews** what it produces. A **Metrics & Tool Usage** folder tracks skills used, time saved and customer value.
callout_label = Agent-generated, not CM
callout = Outputs are drafts until an engineer reviews them. Nothing an agent writes becomes a CM item on its own.
focus = eng, agents, out
flows = write, review
log1 = write | /shared/out/eng1/defect-summary.md | c5
log2 = metrics | skill used · time saved · value | c5
log3 = review | eng1 opened output | c1
</script>
<style>
  :root{
    --bg:#0b0f1a; --bg2:#111726; --panel:rgba(15,20,34,.92); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.2);
    --text:#eef2f9; --muted:#aab4c6; --dim:#8a95aa; --node:#141b2c; --group:rgba(255,255,255,.03); --lblbg:rgba(11,15,26,.86);
    /* the categories: people, agents, memory (CM), skills (CM), connected systems, agent output, plus gray for read-only */
    --c1:#ff9a62; --c2:#2dd4bf; --c3:#5b9dff; --c4:#a6e35c; --c5:#c58bff; --c6:#f5c451; --ro:#a3afc2;
    /* interface only (edit bar, warnings), never used in the diagram */
    --err:#ff7a9c; --warn:#ffb454; --ok:#6ee7a8;
    --display: Bahnschrift, "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.2,.8,.2,1);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --bg2:#e3e8ef; --panel:rgba(255,255,255,.95); --line:rgba(15,23,42,.12); --line2:rgba(15,23,42,.24);
    --text:#0f1522; --muted:#3d485c; --dim:#566177; --node:#ffffff; --group:rgba(15,23,42,.035); --lblbg:rgba(255,255,255,.9);
    --c1:#a8480a; --c2:#0f766e; --c3:#1d4ed8; --c4:#4d7c0f; --c5:#7e22ce; --c6:#8a5a00; --ro:#546478;
    --err:#be123c; --warn:#b45309; --ok:#15803d;
    color-scheme: light;
  }

  html{font-size:clamp(16px,calc(.5vw + 10px),24px)}
  *{box-sizing:border-box}

  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--c3);outline-offset:2px}

  #stage{position:fixed;inset:0}

  #dia{cursor:grab} #dia.drag,#scene.drag{cursor:grabbing} #scene{cursor:grab} #scene.hot{cursor:pointer}
  body.kind-3d #dia, body.kind-2d #scene, body.kind-2d #labels{opacity:0;pointer-events:none}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;transition:opacity .35s var(--ease);font-size:calc(1rem*var(--ls,1))}

  .nl .nm{display:block;font:600 1.2em/1.2 var(--display);color:var(--text)}
  .nl .sb{display:block;font:500 .95em/1.3 var(--sans);color:var(--text);opacity:.85}
  .nl.compact .sb{display:none} .nl.compact{padding-bottom:.4em}
  .fl{padding:.12em .6em;border-radius:999px;background:var(--lblbg);border:1px solid var(--col);font:600 .9em/1.3 var(--sans);color:var(--text)}
  .gl{font:600 .8em var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text);opacity:.75}

  #stepno{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
  #stepno b{color:var(--text);font-weight:600}
  #panel h2{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.2;margin:0}

  .idx{display:flex;flex-wrap:wrap;gap:.4rem}
  .chip{background:none;border:1px solid var(--line2);border-left:.25rem solid var(--col);border-radius:6px;padding:.25rem .6rem;min-height:2rem;font-size:.9rem;cursor:pointer;color:var(--text)}

  #legend .dash{width:100%}

  .field{display:flex;flex-direction:column;gap:4px}

  .editing #editbar{display:flex} .editing #hint{display:none}
  .editing #dia .node, .editing #dia .flab, .editing #dia .glab{cursor:text}

  #dock{position:fixed;left:16px;right:16px;bottom:16px;height:5.2rem;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);
    border-radius:12px;display:flex;align-items:center;gap:.7rem;padding:0 .8rem}
  #dock button{font-size:.9rem}
  .btn,#dock > button,#walk > button,#tools button{height:2.6rem;min-width:2.6rem;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);padding:0 .7rem;white-space:nowrap}
  .btn:hover,#dock > button:hover,#walk > button:hover,#tools button:hover{color:var(--text);border-color:var(--line2)}
  .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;flex:none}

  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:600}
  #walk{flex:1;display:flex;align-items:center;gap:.5rem;min-width:0}
  #rail{flex:1;display:flex;gap:6px;height:2.6rem;min-width:0}
  .chap{flex:1;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;color:var(--dim)}
  .chap .seg2{height:4px;border-radius:2px;background:var(--line2);position:relative;overflow:hidden}
  .chap .seg2 i{position:absolute;inset:0;width:0;background:var(--text)}
  .chap.done .seg2 i{width:100%;background:var(--muted)}

<script>

// Snapshot of the page as shipped. "Save as HTML" swaps only the content block in this copy.
const PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;
const $=id=>document.getElementById(id), body=document.body, root=document.documentElement;

/* =====================================================================

const GROUPS = {

const NODES = {

  mcp_jira:   {from:"agents", to:"mcpj",   col:"c4", both:true, fs:"r", ts:"l", fo:-180},
  mcp_conf:   {from:"agents", to:"mcpc",   col:"c4", both:true, fs:"r", ts:"l", fo:-60},
  mcp_docs:   {from:"agents", to:"mcpd",   col:"c4", both:true, fs:"r", ts:"l", fo:180},
  maint_write:{from:"agents", to:"webapp", col:"c4", fs:"r", ts:"l", fo:60},
  jira_app:   {from:"mcpj",   to:"jira",   col:"c4", both:true, fs:"r", ts:"l"},
  conf_app:   {from:"mcpc",   to:"conf",   col:"c4", both:true, fs:"r", ts:"l"},
  ref_read:   {from:"ref",    to:"mcpd",   col:"ro", ro:true,   fs:"l", ts:"r"},
  write:      {arc:true, from:"agents",  to:"out",    col:"c5", fs:"b", ts:"r", fo:-70, via:[[480,868]]},
  review:     {arc:true, from:"out",     to:"eng",    col:"c1", fs:"t", ts:"b"},

const LEGEND = [["c1","People · human actions"],["c2","Agents · agent actions"],["c3","Memory files · CM-controlled"],["c6","Skill files · CM-controlled"],["c4","Connected systems"],["c5","Agent output · not CM"],["ro","Read-only · dashed"]];
const LOG_COLORS = {c1:1,c2:1,c3:1,c4:1,c5:1,c6:1,ro:1,err:1};
const STEP_SECONDS = 8;

/* =====================================================================
   Content: parse the plain-text block (same format as an imported .txt)
   ===================================================================== */
const ORDER = { meta:["kicker","title","subtitle"], group:["name"], node:["name","sub","detail"], flow:["label","detail"],
  step:["short","title","body","callout_label","callout","focus","flows","log1","log2","log3","log4"] };
const LOGKEYS = ["log1","log2","log3","log4"];
function parseText(src){
  const C={meta:{},group:{},node:{},flow:{},steps:[]}, warn=[];
  let obj=null, key=null, blank=false;
  src.replace(/<\\\/script/gi,"</script").split(/\r?\n/).forEach((raw,i)=>{
    const line=raw.replace(/\s+$/,"");
    if(line===""){ if(key) blank=true; return; }
    if(line[0]==="#") return;
    let m;
    if(/^\s/.test(line)){                        // continuation of the previous value
      if(!key){ warn.push(`Line ${i+1}: indented text with nothing above it`); return; }
      obj[key]+= (blank?"\n\n":(obj[key]?" ":"")) + line.trim(); blank=false; return;

    }
    if((m=line.match(/^([A-Za-z_][\w-]*)\s*=\s?(.*)$/))){
      if(!obj){ warn.push(`Line ${i+1}: "${m[1]}" is above the first [section]`); return; }
      key=m[1].toLowerCase(); obj[key]=m[2].trim(); return;

}
function serialize(C){
  const val=v=>String(v??"").split(/\n{2,}/).map((p,i)=>(i?"\n  ":"")+p.replace(/\s*\n\s*/g," ").trim()).join("\n");
  const sec=(head,o,keys)=>{ let s=`[${head}]\n`; const ks=[...keys,...Object.keys(o).filter(k=>!keys.includes(k)&&k!=="id")];
    ks.forEach(k=>{ if(o[k]!==undefined&&o[k]!=="") s+=`${k} = ${val(o[k])}\n`; }); return s; };
  const out=[sec("meta",C.meta,ORDER.meta)];
  for(const t of ["group","node","flow"]) for(const id in C[t]) out.push(sec(`${t} ${id}`,C[t][id],ORDER[t]));

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
function rich(s){
  return String(s??"").split(/\n{2,}/).map(p=>"<p>"+esc(p)
    .replace(/\{([\w-]+)\}/g,(m,id)=>esc(nm(id)))
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>")+"</p>").join("");

const nm=id=>C.node[id]?.name || id;
const list=s=>String(s||"").split(/[,\s]+/).filter(Boolean);

/* =====================================================================
   State shared by the 3D and 2D views

   ===================================================================== */

  const allN=Object.keys(NODES), allF=Object.keys(FLOWS);
  if(mode==="walk"){ const s=C.steps[step], fo=list(s.focus), all=fo.includes("all"); return {all, nodes:new Set(all?allN:fo), flows:new Set(flowsOf(s))}; }
  if(sel?.kind==="node"){ const fl=allF.filter(id=>FLOWS[id].from===sel.id||FLOWS[id].to===sel.id), nodes=new Set([sel.id]);
    fl.forEach(id=>{nodes.add(FLOWS[id].from);nodes.add(FLOWS[id].to);}); return {all:false,nodes,flows:new Set(fl),primary:sel.id,soft:new Set([...nodes].filter(n=>n!==sel.id))}; }
  if(sel?.kind==="flow"){ const f=FLOWS[sel.id]; return {all:false,nodes:new Set([f.from,f.to]),flows:new Set([sel.id])}; }

// What the camera should frame: {ids, pad} where pad is "all", "step", "node" or "flow"
function focusSpec(){
  if(mode==="view"){
    if(sel?.kind==="node") return {ids:[sel.id],pad:"node"};
    if(sel?.kind==="flow") return {ids:[FLOWS[sel.id].from,FLOWS[sel.id].to],pad:"flow"};
    return {ids:["all"],pad:"all"};
  }
  const fo=list(C.steps[step].focus); return {ids:fo,pad:fo.includes("all")?"all":"step"};
}

let legendEl;
function load(text, from){
  const r=parseText(text);
  if(!r.C.steps.length){ banner("No [step ...] sections found"+(from?` in ${from}`:"")+". Nothing was changed."); return false; }
  C=r.C;
  const bad=[];
  C.steps.forEach((s,i)=>{
    list(s.focus).forEach(id=>{ if(id!=="all"&&!NODES[id]) bad.push(`step ${i+1}: no node "${id}"`); });
    list(s.flows).forEach(id=>{ if(id!=="all"&&!FLOWS[id]) bad.push(`step ${i+1}: no flow "${id}"`); });
    LOGKEYS.forEach(k=>{ const c=(s[k]||"").split("|")[2]; if(s[k]&&c&&!LOG_COLORS[c.trim()]) bad.push(`step ${i+1} ${k}: colour "${c.trim()}" is not one of c1 c2 c3 c4 c5 c6 ro err`); });
  });
  const msgs=[...r.warn,...bad];
  if(msgs.length) banner(msgs.slice(0,3).join(" · ")+(msgs.length>3?` (+${msgs.length-3} more)`:""));

  step=Math.min(step,C.steps.length-1); sel=null; refresh(); return msgs;
}
/* One call after any state change: recompute what is lit, point both cameras, redraw the panel. */
function refresh(cam=true){
  lit=computeLit(); syncPanel(); apply2D(); updateLegend();
  if(cam) setGoals();
  [...rail.children].forEach((c,j)=>{c.classList.toggle("on",j===step);c.classList.toggle("done",j<step);});
  markSel(); renderPanel(); syncDots2D(); updateHint();
}
function syncPanel(){ body.classList.toggle("nopanel",mode==="view"&&!sel&&!editing); placeLegend(); }
function placeLegend(){ if(!legendEl) return; if(editing) legendEl.remove(); else if(body.classList.contains("nopanel")||body.classList.contains("fs")) body.appendChild(legendEl); else panel.appendChild(legendEl); }

/* =====================================================================
   2D view (SVG)
   ===================================================================== */
const svg=$("dia"), NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e;};
let flowEls={}, nodeEls={}, groupEls={}, dotsLayer;
const SIDE={ l:(n,o)=>[n.x,n.y+n.h/2+o], r:(n,o)=>[n.x+n.w,n.y+n.h/2+o], t:(n,o)=>[n.x+n.w/2+o,n.y], b:(n,o)=>[n.x+n.w/2+o,n.y+n.h] };
const isH=s=>s==="l"||s==="r";
function elbow(p,q,exitH,arriveH){
  if(exitH&&arriveH){ const mx=(p[0]+q[0])/2; return [[mx,p[1]],[mx,q[1]]]; }
  if(!exitH&&!arriveH){ const my=(p[1]+q[1])/2; return [[p[0],my],[q[0],my]]; }
  return exitH ? [[q[0],p[1]]] : [[p[0],q[1]]];
}
function route(f){                      // orthogonal connector, edge to edge, with optional corner points
  const a=NODES[f.from], b=NODES[f.to];
  const A={x:a.x+a.w/2,y:a.y+a.h/2}, B={x:b.x+b.w/2,y:b.y+b.h/2};
  const horiz=Math.abs(B.x-A.x)>=Math.abs(B.y-A.y);

  if(playing && mode==="walk" && t>STEP_SECONDS){ if(step<C.steps.length-1) go(step+1); else setPlay(false); }
  const k=1-Math.exp(-dt*(reduce?60:6.5));
  if(goal2){ for(const key of ["x","y","w","h"]) view[key]+=(goal2[key]-view[key])*k; applyView(); }
  if(kind==="3d"){
    if(goal3){ for(const key of ["tx","ty","tz","yaw","pitch","dist"]) cam[key]+=(goal3[key]-cam[key])*k; }
    const fk=1-Math.exp(-dt*9);
    for(const id in NODES) nodeAlpha[id]+=((lit.soft&&lit.soft.has(id)?.75:lit.nodes.has(id)?1:.15)-nodeAlpha[id])*fk;
    for(const id in FLOWS) flowAlpha[id]+=((lit.flows.has(id)?1:.165)-flowAlpha[id])*fk;
    for(const id in GROUPS){ const g=GROUPS[id], live=lit.all||[...lit.nodes].some(n=>{const b=NODES[n]; return b.x>=g.x&&b.y>=g.y&&b.x+b.w<=g.x+g.w&&b.y+b.h<=g.y+g.h;}); groupAlpha[id]=(groupAlpha[id]??1)+((live?1:.19)-(groupAlpha[id]??1))*fk; }
    try{ render3(); }catch(err){ if(!frame.err){ frame.err=1; console.error(err); banner("The 3D view hit a problem; use the 2D view (V)."); setKind("2d"); } }
  } else for(const id in flowEls){ const fe=flowEls[id]; for(const d of fe.dots){ let u=(ts/1000*0.35+d.o)%1; if(d.rev) u=1-u;
    const p=fe.p.getPointAtLength(u*fe.len); d.e.setAttribute("cx",p.x); d.e.setAttribute("cy",p.y); d.e.style.opacity=Math.min(1,Math.min(u,1-u)*8)*(d.rev?.6:1); } }
  const seg=rail.children[step]?.querySelector("i"); if(seg) seg.style.width=(playing?Math.min(1,t/STEP_SECONDS)*100:100)+"%";
  [...rail.children].forEach((c,j)=>{ if(j!==step) c.querySelector("i").style.width=j<step?"100%":"0"; });
  requestAnimationFrame(frame);
}

/* start */
try{ if(localStorage.getItem("explainer-theme")==="light") root.dataset.theme="light"; }catch(e){}
try{ if(localStorage.getItem("explainer-kind")==="2d") kind="2d"; }catch(e){}
try{ const v=+localStorage.getItem("explainer-ls"); if(v) LS=clamp(v,.5,1.3); }catch(e){}
root.style.setProperty("--ls",LS);
readPal(); resize3();
if(!load($("content").textContent)){ C={meta:{},group:{},node:{},flow:{},steps:[{id:"empty",title:"No content"}]}; build2D(); build3D(); buildLegend(); refresh(); }
setKind(kind); resizeAll(); Object.assign(view,goal2); applyView(); Object.assign(cam,goal3);
requestAnimationFrame(frame);
</script>
